# 生产部署：2核2G 阿里云 Ubuntu 优化版
# 用法：docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmaic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmaic_prod_change_me}
      POSTGRES_DB: openmaic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmaic"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openmaic:${POSTGRES_PASSWORD:-openmaic_prod_change_me}@db:5432/openmaic
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NODE_OPTIONS: --max-old-space-size=1024
    ports:
      - "127.0.0.1:3000:3000"   # 只暴露给本机，由 Nginx 反代对外
    deploy:
      resources:
        limits:
          memory: 1280M

volumes:
  pgdata:
