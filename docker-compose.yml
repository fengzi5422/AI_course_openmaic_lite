services:
  db:
    image: postgres:16-alpine
    container_name: openmaic-lite-db
    environment:
      POSTGRES_USER: openmaic
      POSTGRES_PASSWORD: openmaic
      POSTGRES_DB: openmaic
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmaic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
